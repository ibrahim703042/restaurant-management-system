# Local MySQL for Laravel (fixes "connection refused" when no MySQL is installed/running).
#
# 1. Install Docker Desktop for Windows, then from this folder run:
#    docker compose up -d
# 2. Wait ~15s for MySQL to be ready (first run may take longer).
# 3. In your .env set (match these exactly if you use this compose file):
#    DB_CONNECTION=mysql
#    DB_HOST=127.0.0.1
#    DB_PORT=3306
#    DB_DATABASE=restaurant-app
#    DB_USERNAME=root
#    DB_PASSWORD=root
# 4. php artisan config:clear && php artisan migrate
#
# If port 3306 is already used (e.g. XAMPP stopped badly), change left side below to "3307:3306"
# and set DB_PORT=3307 in .env.

services:
  mysql:
    image: mysql:8.0
    container_name: restaurant-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: root
      MYSQL_DATABASE: restaurant-app
    ports:
      - "3306:3306"
    command: --default-authentication-plugin=mysql_native_password --character-set-server=utf8mb4 --collation-server=utf8mb4_unicode_ci
    volumes:
      - restaurant_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 15
      start_period: 30s

volumes:
  restaurant_mysql_data:
